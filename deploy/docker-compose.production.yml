version: '3.8'

# 三个 NewAPI 节点共用的环境变量（YAML 锚点避免重复）
x-newapi-common: &newapi-env
  SQL_DSN: newapi:${MYSQL_PASSWORD}@tcp(mysql-master:3306)/newapi?charset=utf8mb4&parseTime=True&loc=Local
  SQL_MAX_IDLE_CONNS: 50
  SQL_MAX_OPEN_CONNS: 200
  REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis-master:6379/0
  MEMORY_CACHE_ENABLED: "true"
  SYNC_FREQUENCY: 60
  SESSION_SECRET: ${SESSION_SECRET}
  CRYPTO_SECRET: ${CRYPTO_SECRET}
  PORT: 3000
  TZ: Asia/Shanghai
  ERROR_LOG_ENABLED: "true"
  # —— 审计留存 + 消费金额写入（二开1/2）；消费金额随审计自动生效 ——
  AUDIT_LOG_ENABLED: "true"
  AUDIT_LOG_SECRET: ${AUDIT_LOG_SECRET}
  AUDIT_LOG_RETENTION_DAYS: 7
  # —— 审计媒体 OSS（外部云，留空则只记元信息）——
  AUDIT_OSS_BUCKET: ${AUDIT_OSS_BUCKET:-}
  AUDIT_OSS_ENDPOINT: ${AUDIT_OSS_ENDPOINT:-}
  AUDIT_OSS_REGION: ${AUDIT_OSS_REGION:-}
  AUDIT_OSS_ACCESS_KEY: ${AUDIT_OSS_ACCESS_KEY:-}
  AUDIT_OSS_SECRET_KEY: ${AUDIT_OSS_SECRET_KEY:-}
  AUDIT_OSS_FORCE_PATH_STYLE: ${AUDIT_OSS_FORCE_PATH_STYLE:-false}

services:
  nginx:
    image: nginx:1.24-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - newapi-master
      - newapi-slave-1
      - newapi-slave-2
    networks:
      - newapi-network

  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: newapi
      MYSQL_USER: newapi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newapi-network

  redis-master:
    image: redis:7.0-alpine
    container_name: redis-master
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - newapi-network

  newapi-master:
    image: calciumion/new-api:latest
    container_name: newapi-master
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      <<: *newapi-env
      NODE_TYPE: master
      NODE_NAME: cn-master-01
      CHANNEL_UPDATE_FREQUENCY: 60
      BATCH_UPDATE_ENABLED: "true"
      UPDATE_TASK: "true"
    volumes:
      - ./data:/data
      - ./logs/newapi-master:/app/logs
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    networks:
      - newapi-network

  newapi-slave-1:
    image: calciumion/new-api:latest
    container_name: newapi-slave-1
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      <<: *newapi-env
      NODE_TYPE: slave
      NODE_NAME: cn-slave-01
      BATCH_UPDATE_ENABLED: "false"
    volumes:
      - ./data:/data
      - ./logs/newapi-slave-1:/app/logs
    depends_on:
      - mysql-master
      - redis-master
    networks:
      - newapi-network

  newapi-slave-2:
    image: calciumion/new-api:latest
    container_name: newapi-slave-2
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      <<: *newapi-env
      NODE_TYPE: slave
      NODE_NAME: cn-slave-02
      BATCH_UPDATE_ENABLED: "false"
    volumes:
      - ./data:/data
      - ./logs/newapi-slave-2:/app/logs
    depends_on:
      - mysql-master
      - redis-master
    networks:
      - newapi-network

networks:
  newapi-network:
    driver: bridge
