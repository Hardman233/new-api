# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    image: new-api-local:latest
    env_file:
      - .env
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api # ⚠️ IMPORTANT: Change the password in production!
#      - SQL_DSN=root:123456@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - DAILY_BILLING_BACKUP_ENABLED=${DAILY_BILLING_BACKUP_ENABLED:-true}
      - DAILY_BILLING_BACKUP_DIR=${DAILY_BILLING_BACKUP_DIR:-/data/billing-backups}
      - DAILY_BILLING_BACKUP_RUN_AT=${DAILY_BILLING_BACKUP_RUN_AT:-00:15}
      - DAILY_BILLING_BACKUP_LOOKBACK_DAYS=${DAILY_BILLING_BACKUP_LOOKBACK_DAYS:-1}
      - DAILY_BILLING_BACKUP_RUN_ON_STARTUP=${DAILY_BILLING_BACKUP_RUN_ON_STARTUP:-false}
      - DAILY_BILLING_BACKUP_RETENTION_DAYS=${DAILY_BILLING_BACKUP_RETENTION_DAYS:-0}
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
      # ===== 请求/响应审计留存 (二开1)；敏感值从 .env 读取，勿写死在此文件 =====
      - AUDIT_LOG_ENABLED=${AUDIT_LOG_ENABLED:-false}     # 审计总开关
      - AUDIT_LOG_SECRET=${AUDIT_LOG_SECRET:-}            # 正文加密密钥：openssl rand -base64 32
      - AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS:-7}
      - AUDIT_QUERY_API_KEY=${AUDIT_QUERY_API_KEY:-}
      - AUDIT_LOG_RECORD_IP=${AUDIT_LOG_RECORD_IP:-false}
      # ===== 媒体二进制走外部云 OSS (S3 兼容)；纯文本对话直接进数据库，不需要 OSS =====
      # 不填 AUDIT_OSS_BUCKET 则不启用 OSS，媒体二进制只记元信息
      - AUDIT_OSS_BUCKET=${AUDIT_OSS_BUCKET:-}
      - AUDIT_OSS_ENDPOINT=${AUDIT_OSS_ENDPOINT:-}
      - AUDIT_OSS_REGION=${AUDIT_OSS_REGION:-}
      - AUDIT_OSS_ACCESS_KEY=${AUDIT_OSS_ACCESS_KEY:-}
      - AUDIT_OSS_SECRET_KEY=${AUDIT_OSS_SECRET_KEY:-}
      - AUDIT_OSS_KEY_PREFIX=${AUDIT_OSS_KEY_PREFIX:-audit}
      - GENERATED_MEDIA_OSS_ENABLED=${GENERATED_MEDIA_OSS_ENABLED:-true}
      - GENERATED_MEDIA_RETURN_OSS_URL=${GENERATED_MEDIA_RETURN_OSS_URL:-true}
      - GENERATED_MEDIA_UPLOAD_URL_MODE=${GENERATED_MEDIA_UPLOAD_URL_MODE:-download_and_reupload}
      - GENERATED_MEDIA_SYNC_UPLOAD_TIMEOUT_SEC=${GENERATED_MEDIA_SYNC_UPLOAD_TIMEOUT_SEC:-120}
      - GENERATED_MEDIA_CAPTURE_MAX_MB=${GENERATED_MEDIA_CAPTURE_MAX_MB:-64}
      - GENERATED_MEDIA_MAX_DOWNLOAD_MB=${GENERATED_MEDIA_MAX_DOWNLOAD_MB:-1024}
      - GENERATED_MEDIA_QUEUE_SIZE=${GENERATED_MEDIA_QUEUE_SIZE:-1000}
      - GENERATED_MEDIA_CAPTURE_WORKERS=${GENERATED_MEDIA_CAPTURE_WORKERS:-2}
      - GENERATED_MEDIA_WORKERS=${GENERATED_MEDIA_WORKERS:-8}
      - GENERATED_MEDIA_UPLOAD_ATTEMPT_TIMEOUT_SEC=${GENERATED_MEDIA_UPLOAD_ATTEMPT_TIMEOUT_SEC:-600}
      - GENERATED_MEDIA_UPLOAD_RETRY_COUNT=${GENERATED_MEDIA_UPLOAD_RETRY_COUNT:-1}
      - GENERATED_MEDIA_UPLOAD_PROGRESS_LOG_INTERVAL_SEC=${GENERATED_MEDIA_UPLOAD_PROGRESS_LOG_INTERVAL_SEC:-10}
      - GENERATED_MEDIA_PUBLIC_BASE_URL=${GENERATED_MEDIA_PUBLIC_BASE_URL:-}
      - AUDIT_OSS_FORCE_PATH_STYLE=${AUDIT_OSS_FORCE_PATH_STYLE:-false}  # 阿里云/腾讯/AWS 用 false；自建 MinIO 用 true
      # ===== 消费金额写入审计 (二开2) 无需额外配置，随审计开关自动生效 =====
      - STREAMING_TIMEOUT=3000  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - new-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  pg_data:
#  mysql_data:

networks:
  new-api-network:
    driver: bridge
